<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KEEL · Ultra-Minimal Auto-Hide Desktop Widget</title>
  <style>
    :root {
      --bg-tile: rgba(14, 16, 21, 0.92);
      --bg-panel: rgba(12, 14, 18, 0.97);
      --green: #17c964;
      --green-dim: rgba(23, 201, 100, 0.14);
      --amber: #f5a524;
      --amber-dim: rgba(245, 165, 36, 0.16);
      --text: #f4f6f8;
      --muted: #7d8594;
      --hairline: rgba(255, 255, 255, 0.08);
      --hairline-hover: rgba(255, 255, 255, 0.22);
      --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      padding: 14px;
      background: radial-gradient(circle at 50% 20%, #161b26 0%, #07080b 75%);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
    }

    /* =====================================================================
       ULTRA-COMPACT DRAGGABLE RECTANGLE (216px wide!)
       - Border & controls auto-hide when idle (`border-color: transparent`)
       - Can also auto-hide/tuck into the screen edge (`edge-docked`)
       ===================================================================== */
    .widget-anchor {
      position: relative;
      width: 224px;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Screen-Edge Auto-Hide Dock State */
    .widget-anchor.edge-docked {
      transform: translateX(176px);
    }
    .widget-anchor.edge-docked:hover,
    .widget-anchor.edge-docked.notif-peek {
      transform: translateX(0);
    }

    .micro-shell {
      -webkit-app-region: drag;
      cursor: grab;
      position: relative;
      border-radius: 14px;
      padding: 5px;
      /* Auto-hide outer border by default; only reveals on hover/focus */
      background: rgba(10, 12, 16, 0.35);
      border: 1px solid transparent;
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .micro-shell:hover,
    .micro-shell.show-chrome,
    .micro-shell.dragover {
      background: rgba(12, 14, 19, 0.94);
      border-color: var(--hairline-hover);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.65);
    }

    /* Auto-Hide Micro Controls (invisible until hover) */
    .auto-hide-bar {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 0;
      opacity: 0;
      overflow: hidden;
      padding: 0 4px;
      transition: height 0.18s ease, opacity 0.18s ease, margin-bottom 0.18s ease;
    }

    .micro-shell:hover .auto-hide-bar,
    .micro-shell.show-chrome .auto-hide-bar {
      height: 20px;
      opacity: 1;
      margin-bottom: 4px;
    }

    .ah-folder {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    .ah-btns {
      display: flex;
      gap: 3px;
    }

    .mini-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--hairline);
      color: #cbd5e1;
      border-radius: 5px;
      padding: 1px 5px;
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
    }
    .mini-btn:hover,
    .mini-btn.active {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    /* THE TWO BOXES: Left Green (Compliant) | Right Yellow (Not Yet Compliant) */
    .two-boxes {
      -webkit-app-region: no-drag;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      position: relative;
    }

    .stat-tile {
      position: relative;
      height: 64px;
      border-radius: 10px;
      background: var(--bg-tile);
      border: 1px solid var(--hairline);
      padding: 8px 10px 7px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }

    .stat-tile:hover {
      transform: translateY(-1px);
    }

    .stat-tile.green {
      background: linear-gradient(180deg, rgba(23, 201, 100, 0.11) 0%, rgba(14, 16, 21, 0.95) 100%);
      border-color: rgba(23, 201, 100, 0.28);
    }

    .stat-tile.yellow {
      background: linear-gradient(180deg, rgba(245, 165, 36, 0.13) 0%, rgba(14, 16, 21, 0.95) 100%);
      border-color: rgba(245, 165, 36, 0.34);
    }

    /* Bottom Laser Accent */
    .stat-tile::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 0;
      height: 2px;
      border-radius: 2px;
    }
    .stat-tile.green::after {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .stat-tile.yellow::after {
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
    }

    .tile-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .tile-num {
      font-size: 30px;
      font-weight: 400;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }
    .stat-tile.green .tile-num { color: var(--green); }
    .stat-tile.yellow .tile-num { color: var(--amber); }

    .tile-delta {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 4px;
    }
    .tile-delta.down {
      background: rgba(245, 165, 36, 0.2);
      color: var(--amber);
    }
    .tile-delta.up {
      background: rgba(23, 201, 100, 0.2);
      color: var(--green);
    }

    .tile-label {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Drag & Drop Translucent Overlay (Zero space when idle; appears on file drag) */
    .drop-overlay {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: rgba(14, 165, 233, 0.24);
      border: 1.5px dashed #38bdf8;
      backdrop-filter: blur(4px);
      display: none;
      place-items: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #fff;
      z-index: 10;
    }
    .micro-shell.dragover .drop-overlay {
      display: grid;
    }

    /* =====================================================================
       HIGH-INTENTION NOTIFICATION PILL (1-Line Delta + Teammate + File)
       - Immediately shows regression (Amber `8→6`) vs satisfied (Green `6→8`)
       ===================================================================== */
    .notif-pill {
      -webkit-app-region: no-drag;
      margin-top: 6px;
      border-radius: 9px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .notif-pill:hover {
      transform: translateY(-1px);
    }

    /* State 1: Compliance Regressed / Changed (Amber-Red Intention) */
    .notif-pill.regressed {
      background: rgba(45, 26, 8, 0.95);
      border: 1px solid rgba(245, 165, 36, 0.65);
      box-shadow: 0 6px 18px rgba(245, 165, 36, 0.18);
    }

    /* State 2: Compliance Satisfied / Restored (Emerald Green Intention) */
    .notif-pill.satisfied {
      background: rgba(6, 42, 24, 0.95);
      border: 1px solid rgba(23, 201, 100, 0.65);
      box-shadow: 0 6px 18px rgba(23, 201, 100, 0.18);
    }

    .np-badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .notif-pill.regressed .np-badge {
      background: var(--amber);
      color: #090a0d;
    }

    .notif-pill.satisfied .np-badge {
      background: var(--green);
      color: #052e16;
    }

    .np-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .np-primary {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-secondary {
      font-family: var(--mono);
      font-size: 9px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-arrow {
      font-size: 11px;
      font-weight: 800;
      color: var(--text);
      opacity: 0.75;
    }

    /* =====================================================================
       ULTRA-COMPACT TESLA CONFIG SHEET (Same 214px width!)
       ===================================================================== */
    .mini-config {
      -webkit-app-region: no-drag;
      display: none;
      padding: 6px 4px 2px;
    }
    .mini-config.open {
      display: block;
    }

    .seg-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #07080b;
      padding: 2px;
      border-radius: 7px;
      border: 1px solid var(--hairline);
      margin-bottom: 7px;
    }
    .seg-opt {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      padding: 4px 2px;
      border-radius: 5px;
      cursor: pointer;
    }
    .seg-opt.active {
      background: #222632;
      color: #fff;
    }

    .mini-field {
      margin-bottom: 6px;
    }
    .mini-field label {
      display: block;
      font-size: 8.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .mini-input {
      width: 100%;
      background: #07080b;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 5px 7px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 9.5px;
    }

    .mini-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 9.5px;
      color: #cbd5e1;
      padding: 4px 0;
    }

    .t-pill-switch {
      width: 28px;
      height: 15px;
      border-radius: 999px;
      background: var(--green);
      position: relative;
      cursor: pointer;
    }
    .t-pill-switch.off { background: #2c3240; }
    .t-pill-switch::after {
      content: "";
      position: absolute;
      top: 2px;
      right: 2px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.14s ease;
    }
    .t-pill-switch.off::after {
      transform: translateX(-13px);
    }

    /* Compact Web Detail Popover (Opens on click) */
    .mini-popup {
      display: none;
      margin-top: 8px;
      width: 224px;
      background: var(--bg-panel);
      border: 1px solid var(--hairline-hover);
      border-radius: 12px;
      padding: 9px 10px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.7);
      font-size: 10px;
    }
    .mini-popup.open { display: block; }

    .mp-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--hairline);
    }

    .mp-row {
      padding: 5px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border-left: 2.5px solid var(--amber);
      margin-bottom: 5px;
    }
    .mp-row.ok {
      border-left-color: var(--green);
    }
  </style>
</head>
<body>

  <div class="widget-anchor" id="widgetAnchor">
    <div class="micro-shell" id="teslaWidget" title="Drag files or folders directly onto this widget">

      <!-- Auto-Hide Top Micro Bar (Only visible on hover or when pinned) -->
      <div class="auto-hide-bar" id="autoHideBar">
        <span class="ah-folder">
          <span class="live-dot"></span>
          <span id="folderTag">LANTERN · S4</span>
        </span>
        <div class="ah-btns">
          <button class="mini-btn" id="btnSimDrop" onclick="cycleTeammateDrop()" title="Simulate Teammate Drop">⚡</button>
          <button class="mini-btn" id="btnDock" onclick="toggleEdgeDock()" title="Auto-Hide to Screen Edge">⇥</button>
          <button class="mini-btn" id="btnConfig" onclick="toggleConfig()" title="Configure">⚙</button>
        </div>
      </div>

      <!-- Core Two-Box View -->
      <div id="hudCore">
        <div class="two-boxes" id="dropTarget">
          <div class="drop-overlay">⇣ DROP TO BOX</div>

          <!-- Left Green Box: Compliant -->
          <div class="stat-tile green" id="boxCompliant" onclick="openPopup('COMPLIANT')">
            <div class="tile-row">
              <span class="tile-num" id="greenNum">6</span>
              <span class="tile-delta down" id="greenDelta">−2</span>
            </div>
            <span class="tile-label">COMPLIANT</span>
          </div>

          <!-- Right Yellow Box: Not Yet Compliant -->
          <div class="stat-tile yellow" id="boxNonCompliant" onclick="openPopup('NEEDS_REVIEW')">
            <div class="tile-row">
              <span class="tile-num" id="yellowNum">2</span>
              <span class="tile-delta down" id="yellowDelta">+2</span>
            </div>
            <span class="tile-label">UNMET</span>
          </div>
        </div>

        <!-- 1-Line High-Intention Notification Pill -->
        <div class="notif-pill regressed" id="notifPill" onclick="openPopup('NEEDS_REVIEW')">
          <span class="np-badge" id="npBadge">8→6 ⚠</span>
          <div class="np-text">
            <span class="np-primary" id="npPrimary">J. Park · architecture.md</span>
            <span class="np-secondary" id="npSecondary">SEC-ARCH-07 CMK lost</span>
          </div>
          <span class="np-arrow">↗</span>
        </div>
      </div>

      <!-- Ultra-Compact Config View (Replaces HUD Core inside same 214px shell) -->
      <div class="mini-config" id="configPanel">
        <div class="seg-bar">
          <button class="seg-opt active" onclick="pickProfile(this, 6, 2)">US (8)</button>
          <button class="seg-opt" onclick="pickProfile(this, 7, 1)">EU (8)</button>
          <button class="seg-opt" onclick="pickProfile(this, 2, 1)">Live (3)</button>
        </div>
        <div class="mini-field">
          <label>Box Folder ID</label>
          <input class="mini-input" id="cfgFolder" value="318840021" />
        </div>
        <div class="mini-field">
          <label>Topic Subscription</label>
          <input class="mini-input" id="cfgTopic" value="lantern/318840021" />
        </div>
        <div class="mini-toggle">
          <span>Auto-Hide Border</span>
          <div class="t-pill-switch" id="swBorder" onclick="toggleBorderMode(this)"></div>
        </div>
        <div class="mini-toggle">
          <span>Edge Auto-Hide</span>
          <div class="t-pill-switch off" id="swEdge" onclick="toggleEdgeDock(); this.classList.toggle('off')"></div>
        </div>
        <button class="mini-btn" style="width:100%;margin-top:6px;padding:5px;background:#f4f6f8;color:#0a0b0e" onclick="toggleConfig()">
          DONE
        </button>
      </div>

      <input type="file" id="filePicker" multiple style="display:none" onchange="handleFiles(this.files)" />
    </div>

    <!-- Compact Web Detail Popover -->
    <div class="mini-popup" id="webPopupModal">
      <div class="mp-head">
        <span id="mpTitle">UNMET CONTROLS (2)</span>
        <button class="mini-btn" onclick="openFullWeb()">WEB UI ↗</button>
      </div>
      <div id="mpBody"></div>
    </div>
  </div>

  <script>
    const EVENTS = [
      {
        mode: "regressed",
        snap: "S4",
        green: 6,
        gDelta: "−2",
        gClass: "down",
        yellow: 2,
        yDelta: "+2",
        yClass: "down",
        badge: "8→6 ⚠",
        primary: "J. Park · architecture.md",
        secondary: "SEC-ARCH-07 CMK lost"
      },
      {
        mode: "satisfied",
        snap: "S5",
        green: 8,
        gDelta: "+2",
        gClass: "up",
        yellow: 0,
        yDelta: "−2",
        yClass: "up",
        badge: "6→8 ✓",
        primary: "J. Park · architecture-v4.md",
        secondary: "SEC-ARCH-07 CMK restored"
      }
    ];
    let evIdx = 0;

    function cycleTeammateDrop() {
      evIdx = (evIdx + 1) % EVENTS.length;
      applyEvent(EVENTS[evIdx]);
    }

    function applyEvent(ev) {
      document.getElementById("folderTag").textContent = `LANTERN · ${ev.snap}`;
      document.getElementById("greenNum").textContent = ev.green;
      const gD = document.getElementById("greenDelta");
      gD.textContent = ev.gDelta;
      gD.className = `tile-delta ${ev.gClass}`;

      document.getElementById("yellowNum").textContent = ev.yellow;
      const yD = document.getElementById("yellowDelta");
      yD.textContent = ev.yDelta;
      yD.className = `tile-delta ${ev.yClass}`;

      const pill = document.getElementById("notifPill");
      pill.className = `notif-pill ${ev.mode}`;
      document.getElementById("npBadge").textContent = ev.badge;
      document.getElementById("npPrimary").textContent = ev.primary;
      document.getElementById("npSecondary").textContent = ev.secondary;

      // Temporarily peek out if edge-docked
      const anchor = document.getElementById("widgetAnchor");
      if (anchor.classList.contains("edge-docked")) {
        anchor.classList.add("notif-peek");
        setTimeout(() => anchor.classList.remove("notif-peek"), 4000);
      }
    }

    function toggleConfig() {
      const cfg = document.getElementById("configPanel");
      const core = document.getElementById("hudCore");
      const shell = document.getElementById("teslaWidget");
      const isOpen = cfg.classList.toggle("open");
      core.style.display = isOpen ? "none" : "block";
      shell.classList.toggle("show-chrome", isOpen);
      document.getElementById("btnConfig").classList.toggle("active", isOpen);
    }

    function toggleEdgeDock() {
      const anchor = document.getElementById("widgetAnchor");
      const docked = anchor.classList.toggle("edge-docked");
      document.getElementById("btnDock").classList.toggle("active", docked);
    }

    function toggleBorderMode(sw) {
      const off = sw.classList.toggle("off");
      document.getElementById("teslaWidget").classList.toggle("show-chrome", off);
    }

    function pickProfile(btn, g, y) {
      document.querySelectorAll(".seg-opt").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("greenNum").textContent = g;
      document.getElementById("yellowNum").textContent = y;
    }

    function openPopup(type) {
      const pop = document.getElementById("webPopupModal");
      const title = document.getElementById("mpTitle");
      const body = document.getElementById("mpBody");
      pop.classList.add("open");

      if (type === "COMPLIANT") {
        title.textContent = "COMPLIANT HOLDS (6)";
        body.innerHTML = `
          <div class="mp-row ok">
            <strong>SEC-ARCH-01 / 02 / 04 / 05 / 17 / 20</strong>
            <div style="color:var(--muted)">6 controls verified &amp; holding on S4</div>
          </div>
        `;
      } else {
        title.textContent = "UNMET / NEEDS REVIEW (2)";
        body.innerHTML = `
          <div class="mp-row">
            <strong>SEC-ARCH-07 · Critical</strong>
            <div style="color:var(--muted)">KMS CMK &amp; rotation missing in v3</div>
          </div>
          <div class="mp-row">
            <strong>SEC-ARCH-22 · Low</strong>
            <div style="color:var(--muted)">Binding moved to runbook.md §3</div>
          </div>
        `;
      }
    }

    function openFullWeb() {
      if (window.keelDesktop && window.keelDesktop.openWebInterface) {
        window.keelDesktop.openWebInterface({ filter: "NEEDS_REVIEW", snapshot: "S4", controlId: "SEC-ARCH-07" });
      } else {
        window.open("../demo/index.html", "_blank");
      }
    }

    // Whole widget is the Drag & Drop File/Folder zone
    const shell = document.getElementById("teslaWidget");
    ["dragenter", "dragover"].forEach(ev => {
      shell.addEventListener(ev, e => {
        e.preventDefault();
        shell.classList.add("dragover");
      });
    });
    ["dragleave", "drop"].forEach(ev => {
      shell.addEventListener(ev, e => {
        e.preventDefault();
        shell.classList.remove("dragover");
      });
    });
    shell.addEventListener("drop", e => {
      handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
      if (!files || !files.length) return;
      const name = files[0].name;
      applyEvent({
        mode: "satisfied",
        snap: "S5",
        green: 8,
        gDelta: "+2",
        gClass: "up",
        yellow: 0,
        yDelta: "−2",
        yClass: "up",
        badge: "6→8 ✓",
        primary: `You · ${name}`,
        secondary: "Uploaded to Box & verified"
      });
    }
  </script>
</body>
</html>
