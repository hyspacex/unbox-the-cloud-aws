<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Keel - desktop preview</title>
  <link rel="stylesheet" href="widget.css">
  <script src="widget-evidence.js" defer></script>
  <script src="widget-state.js" defer></script>
  <script src="widget.js" defer></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-review" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 3v.01"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
    <symbol id="i-dock" viewBox="0 0 24 24"><path d="M20 3v18M3 12h12m-4-4 4 4-4 4"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><path d="M8 6h.01M16 6h.01M8 12h.01M16 12h.01M8 18h.01M16 18h.01"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M6 18 18 6M7 6h11v11"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
  </svg>

  <div class="widget-anchor" id="widgetAnchor">
    <section class="micro-shell" id="teslaWidget" aria-label="Keel desktop preview">
      <header class="chrome" id="dragHandle">
        <span class="drag-label"><svg class="icon"><use href="#i-grip"/></svg>KEEL <small>DEMO</small></span>
        <div class="chrome-actions">
          <button class="icon-button" id="btnNotifications" aria-label="Show latest notification" aria-controls="detailPanel" aria-expanded="false" title="Latest change">
            <svg class="icon"><use href="#i-bell"/></svg>
          </button>
          <button class="icon-button" id="btnDock" aria-label="Auto-hide at screen edge" aria-pressed="false" title="Auto-hide at screen edge"><svg class="icon"><use href="#i-dock"/></svg></button>
          <button class="icon-button" id="btnConfig" aria-label="Settings" aria-controls="detailPanel" aria-expanded="false" title="Settings"><svg class="icon"><use href="#i-settings"/></svg></button>
        </div>
      </header>

      <div class="counters" id="dropTarget">
        <button class="counter verified" id="boxCompliant" aria-controls="detailPanel" aria-expanded="false">
          <svg class="icon status-icon"><use href="#i-check"/></svg>
          <span class="number" id="greenNum">--</span>
          <span class="counter-delta" id="greenDelta"></span>
        </button>
        <button class="counter review" id="boxNonCompliant" aria-controls="detailPanel" aria-expanded="false">
          <svg class="icon status-icon"><use href="#i-review"/></svg>
          <span class="number" id="yellowNum">--</span>
          <span class="counter-delta" id="yellowDelta"></span>
        </button>
        <span class="demo-mark" title="Simulated data. No Box or AWS calls.">DEMO</span>
      </div>

      <div class="notification-strip" id="notificationStrip">
        <button class="notification-toggle" id="notificationToggle" aria-controls="detailPanel" aria-expanded="false">
          <svg class="icon" id="notificationIcon"><use href="#i-bell"/></svg>
          <span id="notificationSummary"></span>
          <span class="notification-delta" id="notificationDelta"></span>
          <svg class="icon chevron"><use href="#i-chevron"/></svg>
        </button>
      </div>

      <div class="drop-overlay" id="dropOverlay" hidden><svg class="icon"><use href="#i-upload"/></svg><span>Preview a file drop</span></div>
      <section class="detail-panel" id="detailPanel" aria-label="Hover details" hidden>
        <header class="panel-heading">
          <div><span class="eyebrow" id="panelEyebrow"></span><h1 id="panelTitle"></h1></div>
          <div class="panel-actions">
            <button class="icon-button" id="btnCollapse" aria-label="Collapse details" title="Collapse (Escape)"><svg class="icon rotated"><use href="#i-chevron"/></svg></button>
            <button class="icon-button" id="btnDismiss" aria-label="Dismiss notification" title="Dismiss notification" hidden><svg class="icon"><use href="#i-close"/></svg></button>
          </div>
        </header>
        <div id="panelBody"></div>
      </section>
    </section>
    <button id="edgeTab" class="edge-tab" aria-label="Reveal Keel" hidden><span></span><span></span></button>
    <p class="status-message" id="statusMessage" role="status" aria-live="polite" hidden></p>
    <input type="file" id="filePicker" multiple hidden>
    <input type="file" id="folderPicker" webkitdirectory multiple hidden>
  </div>
  <main class="details-page" id="detailsPage" hidden></main>
</body>
</html>
