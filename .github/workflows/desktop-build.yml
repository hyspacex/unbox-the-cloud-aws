name: Desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: windows-x64
            args: --bundles nsis
          - runner: macos-latest
            artifact: macos-universal
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: npm run prepare:ui
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release
      - run: npm run bundle -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: keel-${{ matrix.artifact }}-unsigned
          if-no-files-found: error
          path: |
            desktop-client/src-tauri/target/**/release/bundle/nsis/*-setup.exe
            desktop-client/src-tauri/target/**/release/bundle/dmg/*.dmg
