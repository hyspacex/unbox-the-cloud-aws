<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EpistemicBox — 2D Commit Decision Timeline & Inline Box Diff</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --paper: #ffffff;
      --drawer: #0f172a;
      --drawer-card: #1e293b;
      --drawer-border: #334155;
      --text-dark: #0f172a;
      --text-light: #f8fafc;
      --muted-light: #94a3b8;
      --box-blue: #0061d5;
      --added: #10b981;
      --pivoted: #f59e0b;
      --removed: #f43f5e;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Simulated Box.com Top Bar + Scenario Toggle */
    .box-header {
      min-height: 52px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .box-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .box-logo {
      background: var(--box-blue);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      padding: 4px 9px;
      border-radius: 6px;
      letter-spacing: -0.02em;
    }

    .box-breadcrumb {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .scenario-select {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      background: #f8fafc;
      color: #0f172a;
      cursor: pointer;
    }

    /* Main Split: Left = Box Document Preview | Right = EpistemicBox Browser Plugin Side Panel */
    .split-layout {
      display: grid;
      grid-template-columns: 1fr 420px;
      flex: 1;
    }

    @media (max-width: 900px) {
      .split-layout {
        grid-template-columns: 1fr;
      }
      /* On narrow screens, put the 2D Sidebar first so the Commit Scrubber + Diff are immediately visible */
      .plugin-drawer {
        order: -1;
      }
    }

    /* Left: Clean Box Document Viewer */
    .doc-stage {
      padding: 20px 24px;
      display: flex;
      justify-content: center;
      background: #eef2f6;
    }

    .doc-paper {
      width: 100%;
      max-width: 720px;
      background: var(--paper);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
      border: 1px solid #dbe2ea;
      padding: 24px 28px;
      align-self: flex-start;
    }

    .doc-meta-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      color: #64748b;
    }

    .doc-title {
      font-size: 19px;
      font-weight: 800;
      margin: 0 0 6px 0;
      color: #0f172a;
    }

    .doc-subtitle {
      font-size: 12.5px;
      color: #64748b;
      margin-bottom: 16px;
    }

    .doc-section {
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      border-left: 4px solid transparent;
      transition: all 0.2s ease;
    }

    .doc-section h4 {
      margin: 0 0 6px 0;
      font-size: 13.5px;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .doc-section p {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: #1e293b;
    }

    /* Inline Diff Highlights inside Document */
    .doc-section.hl-ADDED {
      background: rgba(16, 185, 129, 0.08);
      border-left-color: var(--added);
    }
    .doc-section.hl-PIVOTED {
      background: rgba(245, 158, 11, 0.1);
      border-left-color: var(--pivoted);
    }
    .doc-section.hl-REMOVED {
      background: rgba(244, 63, 94, 0.08);
      border-left-color: var(--removed);
    }
    .doc-section.active-focus {
      box-shadow: 0 0 0 2px #0061d5;
    }

    .strike-old {
      display: block;
      font-size: 12px;
      color: #dc2626;
      text-decoration: line-through;
      margin-bottom: 5px;
      background: rgba(244, 63, 94, 0.08);
      padding: 4px 8px;
      border-radius: 4px;
    }

    .inline-new {
      display: block;
      font-size: 13px;
      color: #0f172a;
      font-weight: 600;
      background: rgba(245, 158, 11, 0.16);
      padding: 5px 8px;
      border-radius: 4px;
    }

    /* Right: EpistemicBox Chrome Side Panel / Box Sidebar */
    .plugin-drawer {
      background: var(--drawer);
      color: var(--text-light);
      border-left: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
    }

    .plugin-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--drawer-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #090e1a;
    }

    .plugin-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13.5px;
    }

    .plugin-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    .plugin-tag {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    /* DIMENSION 1: Horizontal Time History of Commit Decisions */
    .dim-section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--drawer-border);
    }

    .dim-label {
      font-family: var(--mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted-light);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timeline-track {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .commit-pill {
      background: var(--drawer-card);
      border: 1.5px solid var(--drawer-border);
      border-radius: 8px;
      padding: 7px 8px;
      cursor: pointer;
      text-align: left;
      color: var(--text-light);
      transition: all 0.15s ease;
    }

    .commit-pill.active {
      border-color: #38bdf8;
      background: #172554;
      box-shadow: 0 0 0 1px #38bdf8;
    }

    .cp-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 800;
      font-size: 12px;
      margin-bottom: 2px;
    }

    .cp-time {
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--muted-light);
      display: block;
      margin-bottom: 4px;
    }

    .cp-state {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      display: inline-block;
    }

    .st-ok { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .st-wait { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    .st-no { background: rgba(244, 63, 94, 0.2); color: #fda4af; }

    /* Compact Bedrock Template Suggestion Bar */
    .bedrock-strip {
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(255, 153, 0, 0.12);
      border: 1px solid rgba(255, 153, 0, 0.35);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* DIMENSION 2: Decision Diff Cards (+Added / ↻Pivoted / −Removed) */
    .diff-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .diff-item {
      background: var(--drawer-card);
      border: 1px solid var(--drawer-border);
      border-left-width: 4px;
      border-radius: 8px;
      padding: 9px 11px;
      cursor: pointer;
    }

    .diff-item.ADDED { border-left-color: var(--added); }
    .diff-item.PIVOTED { border-left-color: var(--pivoted); }
    .diff-item.REMOVED { border-left-color: var(--removed); }

    .di-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 10.5px;
    }

    .di-badge {
      font-family: var(--mono);
      font-weight: 800;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .di-badge.ADDED { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .di-badge.PIVOTED { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    .di-badge.REMOVED { background: rgba(244, 63, 94, 0.2); color: #fda4af; }

    .di-title {
      font-weight: 700;
      font-size: 12.5px;
      margin-bottom: 5px;
      color: #fff;
    }

    .di-line-old {
      font-family: var(--mono);
      font-size: 11px;
      color: #fca5a5;
      background: rgba(244, 63, 94, 0.12);
      padding: 3px 6px;
      border-radius: 4px;
      margin-bottom: 3px;
    }

    .di-line-new {
      font-family: var(--mono);
      font-size: 11px;
      color: #86efac;
      background: rgba(16, 185, 129, 0.12);
      padding: 3px 6px;
      border-radius: 4px;
    }

    /* Footer Approval Bar inside Side Panel */
    .commit-action-bar {
      margin-top: auto;
      padding: 12px 16px;
      background: #090e1a;
      border-top: 1px solid var(--drawer-border);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      padding: 8px 10px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 11.5px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn-approve {
      background: #10b981;
      color: #052e16;
    }

    .btn-reject {
      background: rgba(244, 63, 94, 0.18);
      border-color: #f43f5e;
      color: #fda4af;
    }
  </style>
</head>

      <!-- Bottom Action Bar: Box Task Approval for this Commit -->
      <footer class="commit-action-bar" id="commitActionBar"></footer>
    </aside>

  </div>

              },
              {
                id: "df-flow",
                heading: "3. Approval Workflow & Audit Trail (Pivoted from §5)",
                state: "PIVOTED",
                oldText: "V1 One-Pager §5: We do not build approval/sign-off queues or decision ledgers.",
                body: "Generate version-bound Box Review Packets, assign Box Tasks, and maintain an auditable Decision Ledger in AWS."
              }
            ]
          },
          c3: {
            id: "c3",
            label: "c3 · 2D Plugin",
            time: "Oct 16 · 21:45",
            statusText: "CURRENT",
            statusClass: "st-ok",
            docTitle: "EpistemicBox — 2D Commit Timeline & Box Plugin (V3)",
            docSub: "Simplified to 2 Dimensions: (1) Commit Timeline + (2) Inline Decision Diff",
            bedrockTemplate: "Hackathon Product Spec",
            bedrockDoor: "Type 1 • Final Scope",
            reviewer: "Max & Team",
            diffs: [
              {
                id: "df-delivery",
                state: "PIVOTED",
                title: "3-Column Portal ──► 2D Box Sidebar / Browser Plugin",
                oldVal: "- Complex standalone 3-column dashboard",
                newVal: "+ 2D Sidebar: (1) Commit Timeline + (2) Inline Diff",
                role: "UX"
              },
              {
                id: "df-bedrock",
                state: "ADDED",
                title: "Box Folder Intake + Amazon Decision Model",
                oldVal: "- Manual template selection",
                newVal: "+ Bedrock classifies Type 1/2 Door & suggests template",
                role: "AWS"
              }
            ],
            sections: [
              {
                id: "df-delivery",
                heading: "1. Delivery Form Factor: 2D Sidebar on Box",
                state: "PIVOTED",
                oldText: "Previous UI: Complex 3-column standalone portal.",
                body: "Deliver as a Box Web App Integration / Chrome Side Panel with just two dimensions: (1) Time History of Commit Decisions and (2) Inline Decision Diff."
              },
              {
                id: "df-bedrock",
                heading: "2. Folder Intake with Amazon Decision Model",
                state: "ADDED",
                oldText: null,
                body: "Project owner uploads a Box folder; Amazon Bedrock classifies Type 1 (One-Way Door) vs. Type 2 (Two-Way Door) and suggests the Project Template bundle."
              },
              {
                id: "df-flow",
                heading: "3. Version-Bound Box Tasks Approval",
                state: null,
                body: "One-click Approve/Reject in the sidebar verifies Box Task completion and advances the Approved Baseline."
              }
            ]
          }
        }
      }
    };

    let currentScenario = "bank";

    function switchScenario(val) {
      currentScenario = val;
      render();
    }

    function selectCommit(commitId) {
      DATA[currentScenario].selectedId = commitId;
      render();
    }

    function focusSection(secId) {
      document.querySelectorAll(".doc-section").forEach(el => el.classList.remove("active-focus"));
      const target = document.getElementById(secId);
      if (target) {
        target.classList.add("active-focus");
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    function handleDecision(decision) {
      const sc = DATA[currentScenario];
      const commit = sc.commits[sc.selectedId];
      if (decision === "APPROVE") {
        sc.baselineId = commit.id;
        commit.statusText = "APPROVED";
        commit.statusClass = "st-ok";
      } else {
        commit.statusText = "REJECTED";
        commit.statusClass = "st-no";
      }
      render();
    }

    function render() {
      const sc = DATA[currentScenario];
      const commit = sc.commits[sc.selectedId];
      const baseCommit = sc.commits[sc.baselineId];

      document.getElementById("boxBreadcrumb").innerHTML =
        `${sc.breadcrumb} <strong>${commit.docTitle}</strong>`;
      document.getElementById("baselineIndicator").textContent =
        `Baseline: ${baseCommit.label}`;

      // 1. Render Horizontal Commit Timeline
      const trackEl = document.getElementById("timelineTrack");
      trackEl.innerHTML = Object.values(sc.commits).map(c => `
        <button class="commit-pill ${c.id === sc.selectedId ? "active" : ""}" onclick="selectCommit('${c.id}')">
          <div class="cp-top">
            <span>${c.label}</span>
            ${c.id === sc.baselineId ? "<span title='Approved Baseline'>★</span>" : ""}
          </div>
          <span class="cp-time">${c.time}</span>
          <span class="cp-state ${c.statusClass}">${c.statusText}</span>
        </button>
      `).join("");

      // Bedrock Strip
      document.getElementById("bedrockStrip").innerHTML = `
        <span><strong>Template:</strong> ${commit.bedrockTemplate}</span>
        <span style="font-family:var(--mono);color:#fcd34d;font-weight:700;">${commit.bedrockDoor}</span>
      `;

      // 2. Render Document Paper on Left
      const badgeLabel = {
        ADDED: "+ ADDED",
        PIVOTED: "↻ PIVOTED",
        REMOVED: "− REMOVED"
      };

      document.getElementById("docPaper").innerHTML = `
        <div class="doc-meta-strip">
          <span>${commit.docSub}</span>
          <span style="font-family:var(--mono);font-weight:700;color:#0061d5;">Commit: ${commit.label}</span>
        </div>
        <h1 class="doc-title">${commit.docTitle}</h1>
        <div class="doc-subtitle">Viewing inside Box Document Preview — changed commitments are highlighted inline.</div>
        ${commit.sections.map(sec => `
          <div class="doc-section ${sec.state ? "hl-" + sec.state : ""}" id="${sec.id}">
            <h4>
              <span>${sec.heading}</span>
              ${sec.state ? `<span class="di-badge ${sec.state}">${badgeLabel[sec.state]}</span>` : ""}
            </h4>
            ${sec.oldText ? `<span class="strike-old">${sec.oldText}</span>` : ""}
            <p class="${sec.state ? "inline-new" : ""}">${sec.body}</p>
          </div>
        `).join("")}
      `;

      // 3. Render Decision Diff Stack on Right
      document.getElementById("diffStack").innerHTML = commit.diffs.map(d => `
        <div class="diff-item ${d.state}" onclick="focusSection('${d.id}')">
          <div class="di-header">
            <span class="di-badge ${d.state}">${d.state === "ADDED" ? "+ ADDED" : d.state === "PIVOTED" ? "↻ PIVOTED" : "− REMOVED"}</span>
            <span style="color:var(--muted-light);font-family:var(--mono);">Task: ${d.role}</span>
          </div>
          <div class="di-title">${d.title}</div>
          <div class="di-line-old">${d.oldVal}</div>
          <div class="di-line-new">${d.newVal}</div>
        </div>
      `).join("");

      // 4. Render Bottom Action Bar
      const isBaseline = commit.id === sc.baselineId;
      document.getElementById("commitActionBar").innerHTML = `
        <div style="font-size:11px;color:var(--muted-light);">
          <strong>Box Task Approver:</strong> ${commit.reviewer}
        </div>
        ${isBaseline ? `
          <div style="margin-top:6px;padding:7px 10px;border-radius:6px;background:rgba(16,185,129,0.16);color:#6ee7b7;font-size:11.5px;font-weight:700;text-align:center;">
            ★ Active Approved Baseline (${commit.label})
          </div>
        ` : `
          <div class="btn-row">
            <button class="btn btn-approve" onclick="handleDecision('APPROVE')">
              ✓ Approve ${commit.id}
            </button>
            <button class="btn btn-reject" onclick="handleDecision('REJECT')">
              ✕ Reject (Keep ${baseCommit.id})
            </button>
          </div>
        `}
      `;
    }

    render();
  </script>
</body>
</html>
